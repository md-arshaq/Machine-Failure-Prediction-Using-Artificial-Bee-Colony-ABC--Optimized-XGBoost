# Configuration for ABC-Optimized XGBoost Machine Failure Prediction
# Course: Bio-Inspired Algorithms (23DS7BSBIO)
# Dataset: AI4I 2020 Predictive Maintenance Dataset

dataset:
  raw_path: "data/raw/ai4i2020.csv"
  processed_dir: "data/processed"
  target_column: "Machine failure"
  identifier_columns:
    - "UDI"
    - "Product ID"
  leakage_columns:
    - "TWF"
    - "HDF"
    - "PWF"
    - "OSF"
    - "RNF"
  categorical_features:
    - "Type"
  numerical_features:
    - "Air temperature [K]"
    - "Process temperature [K]"
    - "Rotational speed [rpm]"
    - "Torque [Nm]"
    - "Tool wear [min]"
  engineered_features:
    - "temperature_difference"
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42

xgboost:
  baseline:
    n_estimators: 300
    max_depth: 5
    learning_rate: 0.1
    min_child_weight: 1.0
    subsample: 0.8
    colsample_bytree: 0.8
    gamma: 0.0
    reg_lambda: 1.0
    tree_method: "hist"
    objective: "binary:logistic"
    eval_metric: "aucpr"
    random_state: 42
  early_stopping_rounds: 30
  final_seeds: [0, 1, 2, 3, 4]
  search_bounds:
    n_estimators: [100, 600]
    max_depth: [2, 10]
    learning_rate: [0.01, 0.30]
    min_child_weight: [1.0, 10.0]
    subsample: [0.60, 1.00]
    colsample_bytree: [0.60, 1.00]
    gamma: [0.0, 5.0]
    scale_pos_weight: [1.0, 30.0]

abc:
  n_food_sources: 10
  n_employed: 10
  n_onlooker: 10
  max_cycles: 10
  abandonment_limit: 5
  max_evals: 240
  random_seed: 42
  quick_mode:
    n_food_sources: 4
    n_employed: 4
    n_onlooker: 4
    max_cycles: 2
    abandonment_limit: 2
    max_evals: 16
    n_estimators_cap: 50

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  results_dir: "results"
  logs_dir: "results/logs"
  tables_dir: "results/tables"
  figures_dir: "results/figures"
  models_dir: "results/models"
  predictions_dir: "results/predictions"
  checkpoints_dir: "checkpoints"

visualization:
  dpi: 200
  format: "png"

